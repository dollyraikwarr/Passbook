name: CI & Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contract-tests:
    name: Soroban Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: clippy, rustfmt
          targets: wasm32v1-none

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: contracts -> contracts/target

      - name: Check Formatting
        run: cargo fmt --all --manifest-path contracts/Cargo.toml -- --check
        continue-on-error: true

      - name: Run Soroban Contract Tests
        run: cargo test --workspace --manifest-path contracts/Cargo.toml

  frontend-tests:
    name: Frontend SPA Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npx vitest run

      - name: Build Production Bundle
        run: npm run build

  summary:
    needs: [contract-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: CI Success Summary
        run: echo "✅ All Soroban contract and frontend tests passed successfully!"
