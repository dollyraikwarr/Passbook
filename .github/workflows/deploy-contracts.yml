name: Deploy Soroban Contracts

on:
  workflow_dispatch:

jobs:
  deploy-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Compile Contracts
        run: |
          cargo build --target wasm32-unknown-unknown --release --manifest-path contracts/Cargo.toml

      - name: Deployment Instructions Summary
        run: echo "Contracts compiled successfully into release WASM target binaries."
